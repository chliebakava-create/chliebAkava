<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chlieb a Káva | Domov</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfaf6;
            color: #4a332d;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #8d6e63;
            color: white;
            width: 100%;
            padding: 40px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 800px;
            padding: 40px;
            text-align: center;
            background: white;
            margin-top: -30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { margin: 0; font-size: 2.5em; }
        .icon { font-size: 50px; margin-bottom: 10px; }
        p { line-height: 1.6; font-size: 1.2em; }
        .btn {
            display: inline-block;
            background-color: #795548;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #5d4037; }
        footer { margin-top: auto; padding: 20px; font-size: 0.9em; color: #a1887f; }
    </style>
</head>
<body>

    <header>
        <div class="icon">🍞 ☕</div>
        <h1>Chlieb a Káva</h1>
    </header>

    <div class="container">
        <h2>Vitajte v našom svete</h2>
        <p>Práve sa pozeráte na webovú stránku, ktorá bola vytvorená pomocou AI a hostovaná na GitHub Pages.</p>
        <p>Tento dizajn je čistý, responzívny a pripravený na vaše ďalšie nápady.</p>
        <a href="#" class="btn">Zistiť viac o nás</a>
    </div>

    <footer>
        &copy; 2026 Chlieb a Káva. Vytvorené s nadšením.
    </footer>

</body>
</html>
