<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chliebAkava | Kvások a káva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #faf9f6; color: #1c1917; }
        .serif { font-family: 'Playfair Display', serif; }
        .hero-bg { background: linear-gradient(rgba(255,255,255,0.😎, rgba(255,255,255,0.8)), url('https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=1000'); background-size: cover; background-position: center; }
        .product-card img { transition: transform 0.5s ease; }
        .product-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-sm z-50 border-b border-stone-200 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold italic serif cursor-pointer" onclick="navigate('home')">chliebAkava</h1>
            <div class="space-x-8 uppercase text-[10px] tracking-widest font-bold text-stone-500">
                <button onclick="navigate('home')" class="hover:text-black">Domov</button>
                <button onclick="navigate('shop')" class="hover:text-black">Obchod</button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-20"></main>

    <script>
        const PRODUCTS = [
            { id: '1', name: 'Oválna ošatka', price: 16.90, img: 'https://images.unsplash.com/photo-1589367920969-ab8e050bac04?auto=format&fit=crop&q=80&w=500' },
            { id: '2', name: 'Nožík na narezávanie', price: 22.50, img: 'https://images.unsplash.com/photo-1586439702132-4634616616c5?auto=format&fit=crop&q=80&w=500' },
            { id: '3', name: 'Ľanové vrecúško', price: 12.00, img: 'https://images.unsplash.com/photo-1590650213165-c1fef80648c4?auto=format&fit=crop&q=80&w=500' }
        ];

        function navigate(view) {
            const content = document.getElementById('main-content');
            window.scrollTo(0,0);
            if (view === 'home') {
                content.innerHTML = `
                    <section class="hero-bg min-h-[70vh] flex flex-col items-center justify-center text-center px-6">
                        <h1 class="text-5xl md:text-7xl font-bold italic serif mb-6">Vôňa chleba,<br>pokoj v šálke.</h1>
                        <p class="text-stone-600 max-w-md mb-8 text-lg">Ručne robené pomôcky pre vašu domácu pekáreň.</p>
                        <button onclick="navigate('shop')" class="bg-stone-900 text-white px-12 py-4 uppercase text-xs tracking-widest font-bold hover:bg-black transition-all">Vstúpiť do obchodu</button>
                    </section>
                `;
            } else if (view === 'shop') {
                content.innerHTML = `
                    <div class="max-w-7xl mx-auto px-6 py-16">
                        <h2 class="text-4xl serif italic mb-12 text-center">Naša ponuka</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                            ${PRODUCTS.map(p => `
                                <div class="product-card group">
                                    <div class="aspect-[3/4] overflow-hidden bg-stone-200 mb-4 rounded-lg">
                                        <img src="${p.img}" class="w-full h-full object-cover">
                                    </div>
                                    <h3 class="text-lg font-bold serif italic">${p.name}</h3>
                                    <p class="text-stone-500 mb-4">${p.price.toFixed(2)} €</p>
                                    <button class="w-full border border-stone-900 py-2 uppercase text-[10px] font-bold hover:bg-stone-900 hover:text-white transition-all">Pridať do košíka</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }
        navigate('home');
    </script>
</body>
</html>
