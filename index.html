<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chliebAkava | Kvások, káva a pomalý život</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #faf9f6; --accent-color: #1c1917; --text-muted: #78716c; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--accent-color); scroll-behavior: smooth; }
        h1, h2, h3, h4, .serif { font-family: 'Playfair Display', serif; }
        .logo-font { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f5f5f4; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .cart-sidebar { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        .cart-sidebar.open { transform: translateX(0); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 100; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="overflow-x-hidden">

    <nav class="fixed top-0 left-0 right-0 bg-stone-50/90 backdrop-blur-md z-50 border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 cursor-pointer" onclick="navigate('home')">
                    <h1 class="text-2xl tracking-tight logo-font">chliebAkava</h1>
                </div>
                <div class="hidden md:flex space-x-12 uppercase text-[10px] tracking-[0.2em] font-semibold text-stone-500">
                    <button onclick="navigate('home')" class="hover:text-black transition-colors">Domov</button>
                    <button onclick="navigate('about')" class="hover:text-black transition-colors">O nás</button>
                    <button onclick="navigate('blog')" class="hover:text-black transition-colors">Blog</button>
                    <button onclick="navigate('shop')" class="hover:text-black transition-colors">Obchod</button>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="toggleCart(true)" class="relative p-2 text-stone-700 hover:text-black transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.31H5.12"/></svg>
                        <span id="cart-count" class="absolute top-0 right-0 bg-stone-900 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-20 min-h-screen"></main>

    <footer class="bg-stone-100 border-t border-stone-200 pt-16 pb-8 mt-24">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12 text-center md:text-left">
                <div>
                    <h1 class="text-2xl logo-font mb-4">chliebAkava</h1>
                    <p class="text-stone-600 text-sm italic leading-relaxed">Hľadáme krásu v jednoduchosti. Kváskový chlieb, výberová káva a spomalenie.</p>
                </div>
                <div>
                    <h3 class="uppercase text-[10px] tracking-widest font-bold text-stone-900 mb-6">Sledujte nás</h3>
                    <div class="flex justify-center md:justify-start space-x-4 text-stone-600">
                        <a href="https://www.instagram.com/chliebakava/" target="_blank" class="hover:text-black">Instagram</a>
                        <a href="https://www.tiktok.com/@chliebakava" target="_blank" class="hover:text-black">TikTok</a>
                    </div>
                </div>
                <div>
                    <h3 class="uppercase text-[10px] tracking-widest font-bold text-stone-900 mb-6">Kontakt</h3>
                    <p class="text-sm text-stone-600">chliebakava@gmail.com</p>
                </div>
                <div>
                    <h3 class="uppercase text-[10px] tracking-widest font-bold text-stone-900 mb-6">Právne</h3>
                    <ul class="space-y-3 text-sm text-stone-600">
                        <li><a href="#" class="hover:text-black">Obchodné podmienky</a></li>
                        <li><a href="#" class="hover:text-black">GDPR</a></li>
                    </ul>
                </div>
            </div>
            <div class="border-t border-stone-200 pt-8 text-xs text-stone-500 flex justify-between items-center">
                <p>© 2024 chliebAkava s.r.o.</p>
                <p>IČO: 12345678</p>
            </div>
        </div>
    </footer>

    <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="cart-sidebar fixed top-0 right-0 w-full max-w-md h-full bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-8 border-b flex justify-between items-center bg-stone-50">
            <h2 class="text-xs uppercase font-bold tracking-widest">Váš Košík</h2>
            <button onclick="toggleCart(false)" class="p-2 hover:bg-stone-200 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
            </button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-8 space-y-6 custom-scrollbar"></div>
        <div id="cart-footer" class="p-8 bg-white border-t"></div>
    </div>

    <script>
        // --- Produkty ---
        const PRODUCTS = [
            { id: '1', name: 'Oválna ošatka', price: 16.90, category: 'Ošatky', image: 'https://images.unsplash.com/photo-1589367920969-ab8e050bac04?w=400', description: 'Prírodná oválna ošatka z nebieleného ratanu.' },
            { id: '2', name: 'Okrúhla ošatka', price: 14.90, category: 'Ošatky', image: 'https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=400', description: 'Okrúhla ošatka na klasické bochníky.' },
            { id: '3', name: 'Nožík na narezávanie', price: 22.50, category: 'Náradie na chlieb', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400', description: 'Profesionálny nožík na narezávanie.' },
            { id: '4', name: 'Stierka na cesto', price: 8.90, category: 'Náradie na chlieb', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400', description: 'Praktická stierka uľahčuje miešanie.' },
            { id: '5', name: 'Látková vložka do ošatky', price: 6.50, category: 'Náradie na chlieb', image: 'https://images.unsplash.com/photo-1581339399838-2a120c18bba3?w=400', description: 'Bavlnená vložka zabraňuje prilepeniu.' },
            { id: '6', name: 'Sklená dóza na kvások', price: 12.00, category: 'Náradie na chlieb', image: 'https://images.unsplash.com/photo-1621841957884-1210fe1bbd66?w=400', description: 'Dóza s odmerkou pre váš kvások.' },
            { id: '7', name: 'Sada na pečenie chleba', price: 45.00, category: 'Sady pre začiatočníkov', image: 'https://images.unsplash.com/photo-1598373182133-52452f7691ef?w=400', description: 'Kompletná štartovacia sada.' }
        ];

        let cart = [];

        window.navigate = (view, productId = null) => {
            const content = document.getElementById('main-content');
            content.className = 'pt-20 min-h-screen fade-in';
            window.scrollTo(0, 0);

            if (view === 'home') {
                content.innerHTML = `
                    <section class="min-h-[80vh] flex flex-col md:flex-row items-center bg-[#faf9f6] text-center md:text-left px-8">
                        <div class="flex-1 md:pl-24 py-16">
                            <h1 class="text-5xl md:text-7xl font-bold mb-8 italic serif">Vôňa chleba,<br/>pokoj v šálke.</h1>
                            <button onclick="navigate('shop')" class="bg-stone-900 text-white px-10 py-5 uppercase text-xs font-bold tracking-widest shadow-xl">Obchod</button>
                        </div>
                        <div class="flex-1 flex justify-center p-12">
                            <img src="https://chliebakava.sk/wp-content/uploads/2023/11/logo-chliebakava.png" class="max-w-md w-full opacity-80">
                        </div>
                    </section>`;
            } else if (view === 'shop') {
                content.innerHTML = `
                    <div class="max-w-7xl mx-auto px-8 py-16">
                        <h1 class="text-5xl text-center serif italic mb-16">Obchod</h1>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            ${PRODUCTS.map(p => `
                                <div class="cursor-pointer group" onclick="navigate('product', '${p.id}')">
                                    <img src="${p.image}" class="w-full h-80 object-cover mb-4 group-hover:scale-105 transition-all duration-500">
                                    <h3 class="text-lg font-bold italic serif">${p.name}</h3>
                                    <p class="text-stone-900">${p.price.toFixed(2)} €</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            } else if (view === 'product' && productId) {
                const p = PRODUCTS.find(x => x.id === productId);
                content.innerHTML = `
                    <div class="max-w-7xl mx-auto px-8 py-16 grid md:grid-cols-2 gap-16">
                        <img src="${p.image}" class="w-full shadow-lg">
                        <div class="flex flex-col justify-center">
                            <h1 class="text-5xl serif italic font-bold mb-6">${p.name}</h1>
                            <p class="text-2xl mb-8">${p.price.toFixed(2)} €</p>
                            <p class="mb-12 italic text-stone-600 leading-relaxed">${p.description}</p>
                            <button onclick="addToCart('${p.id}')" class="w-full bg-stone-900 text-white py-5 uppercase font-bold text-xs tracking-widest shadow-xl">Pridať do košíka</button>
                        </div>
                    </div>`;
            } else if (view === 'checkout') {
                renderCheckoutPage(content);
            }
        };

        // --- Funkcia pre novú stránku Pokladne ---
        const renderCheckoutPage = (container) => {
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto px-8 py-24 text-center">
                        <h1 class="text-4xl serif italic mb-8">Váš košík je prázdny</h1>
                        <button onclick="navigate('shop')" class="text-stone-900 border-b border-stone-900 font-bold uppercase text-xs tracking-widest">Späť do obchodu</button>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="max-w-5xl mx-auto px-8 py-16">
                    <h1 class="text-5xl serif italic mb-16 text-center">Súhrn objednávky</h1>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-16">
                        <div class="lg:col-span-2 space-y-8">
                            ${cart.map(item => `
                                <div class="flex items-center justify-between border-b border-stone-100 pb-8">
                                    <div class="flex items-center gap-6">
                                        <img src="${item.image}" class="w-20 h-20 object-cover rounded">
                                        <div>
                                            <h3 class="text-lg font-bold italic serif">${item.name}</h3>
                                            <p class="text-sm text-stone-500">${item.qty} x ${item.price.toFixed(2)} €</p>
                                        </div>
                                    </div>
                                    <p class="font-bold">${(item.price * item.qty).toFixed(2)} €</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-stone-50 p-8 h-fit shadow-sm rounded">
                            <h2 class="text-xs uppercase font-bold tracking-widest mb-8 border-b pb-4">Spolu</h2>
                            <div class="space-y-4 mb-8">
                                <div class="flex justify-between text-stone-600">
                                    <span>Medzisúčet</span>
                                    <span>${total.toFixed(2)} €</span>
                                </div>
                                <div class="flex justify-between text-stone-600">
                                    <span>Doprava</span>
                                    <span class="italic text-xs">Vypočíta sa v ďalšom kroku</span>
                                </div>
                                <div class="flex justify-between text-xl font-bold pt-4 border-t border-stone-200">
                                    <span>Celkom</span>
                                    <span>${total.toFixed(2)} €</span>
                                </div>
                            </div>
                            <button onclick="alert('Objednávka odoslaná do platobnej brány!')" class="w-full bg-stone-900 text-white py-4 uppercase font-bold text-xs tracking-widest shadow-lg hover:bg-black transition-colors">
                                Zaplatiť teraz
                            </button>
                            <p class="text-[10px] text-stone-400 mt-6 text-center leading-relaxed">
                                Bezpečná platba cez GoPay, Stripe alebo Besteron.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        };

        window.addToCart = (id) => {
            const p = PRODUCTS.find(x => x.id === id);
            const exists = cart.find(x => x.id === id);
            if (exists) exists.qty++;
            else cart.push({...p, qty: 1});
            updateCartUI();
            toggleCart(true);
        };

        window.removeFromCart = (id) => {
            cart = cart.filter(x => x.id !== id);
            updateCartUI();
        };

        const updateCartUI = () => {
            const items = document.getElementById('cart-items');
            const footer = document.getElementById('cart-footer');
            const count = document.getElementById('cart-count');
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const totalSum = cart.reduce((a, b) => a + (b.price * b.qty), 0);

            count.innerText = totalQty;
            count.classList.toggle('hidden', totalQty === 0);

            if (cart.length === 0) {
                items.innerHTML = `<p class="text-center text-stone-400 py-20 italic">Košík je prázdny.</p>`;
                footer.innerHTML = '';
            } else {
                items.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center border-b border-stone-50 pb-4">
                        <div class="flex gap-4 items-center">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded">
                            <div>
                                <h3 class="text-sm font-bold serif italic">${item.name}</h3>
                                <p class="text-[10px] text-stone-500">${item.qty}x ${item.price.toFixed(2)} €</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" class="text-stone-300 hover:text-stone-900">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                `).join('');
                footer.innerHTML = `
                    <div class="flex justify-between mb-6 font-bold">
                        <span>Spolu:</span>
                        <span>${totalSum.toFixed(2)} €</span>
                    </div>
                    <button onclick="navigate('checkout'); toggleCart(false);" class="w-full bg-stone-900 text-white py-4 uppercase font-bold text-xs tracking-widest shadow-xl">
                        Do pokladne
                    </button>
                `;
            }
        };

        window.toggleCart = (show) => {
            document.getElementById('cart-sidebar').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('active', show);
            document.body.style.overflow = show ? 'hidden' : 'auto';
        };

        // Spustenie domovskej stránky
        navigate('home');
    </script>
</body>
</html>
