<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chliebAkava | Kvások, káva a pomalý život</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #faf9f6; --accent-color: #1c1917; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--accent-color); scroll-behavior: smooth; }
        h1, h2, h3, h4, .serif { font-family: 'Playfair Display', serif; }
        .logo-font { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        .cart-sidebar.open { transform: translateX(0); }
        .overlay { display: none; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); position: fixed; inset: 0; z-index: 100; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="overflow-x-hidden">

    <nav class="fixed top-0 left-0 right-0 bg-stone-50/90 backdrop-blur-md z-50 border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 cursor-pointer" onclick="navigate('home')">
                    <h1 class="text-2xl tracking-tight logo-font">chliebAkava</h1>
                </div>
                <div class="hidden md:flex space-x-12 uppercase text-[10px] tracking-[0.2em] font-semibold text-stone-500">
                    <button onclick="navigate('home')" class="hover:text-black transition-colors">Domov</button>
                    <button onclick="navigate('blog')" class="hover:text-black transition-colors">Blog</button>
                    <button onclick="navigate('shop')" class="hover:text-black transition-colors">Obchod</button>
                </div>
                <div onclick="toggleCart(true)" class="cursor-pointer relative p-2 text-stone-700 hover:text-black transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.31H5.12"/></svg>
                    <span id="cart-count" class="absolute top-0 right-0 bg-stone-900 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-20 min-h-screen"></main>

    <footer class="bg-stone-100 border-t border-stone-200 pt-16 pb-8">
        <div class="max-w-7xl mx-auto px-4 text-center md:text-left">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
                <div class="col-span-1 md:col-span-2">
                    <h1 class="text-2xl logo-font mb-4">chliebAkava</h1>
                    <p class="text-stone-600 max-w-sm text-sm leading-relaxed italic">Hľadáme krásu v jednoduchosti. Kváskový chlieb, výberová káva a spomalenie.</p>
                </div>
                <div>
                    <h3 class="uppercase text-[10px] tracking-widest font-bold mb-6">Kontakt</h3>
                    <p class="text-sm text-stone-600">chliebakava@gmail.com</p>
                </div>
                <div>
                    <h3 class="uppercase text-[10px] tracking-widest font-bold mb-6">Právne</h3>
                    <p class="text-sm text-stone-600">Obchodné podmienky</p>
                </div>
            </div>
            <div class="border-t border-stone-200 pt-8 text-[10px] text-stone-400 uppercase tracking-widest flex justify-between">
                <p>© 2024 chliebAkava s.r.o.</p>
                <p>Vytvorené s láskou k remeslu</p>
            </div>
        </div>
    </footer>

    <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>
    <div id="cart-sidebar" class="cart-sidebar fixed top-0 right-0 w-full max-w-md h-full bg-white z-[110] shadow-2xl flex flex-col">
        <div class="p-8 border-b flex justify-between items-center bg-stone-50">
            <h2 class="text-xs uppercase font-bold tracking-widest">Váš Košík</h2>
            <button onclick="toggleCart(false)" class="text-stone-400 hover:text-black uppercase text-[10px] font-bold">Zatvoriť</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-8 space-y-6 italic text-stone-500">
            Váš košík je zatiaľ prázdny.
        </div>
        <div id="cart-footer" class="p-8 border-t bg-stone-50"></div>
    </div>

    <script>
        // --- DÁTA ---
        const PRODUCTS = [
            { id: '1', name: 'Oválna ošatka', price: 16.90, category: 'Ošatky', image: 'https://images.unsplash.com/photo-1589367920969-ab8e050bac04?q=80&w=800&auto=format&fit=crop', desc: 'Prírodná oválna ošatka z nebieleného ratanu.' },
            { id: '2', name: 'Okrúhla ošatka', price: 14.90, category: 'Ošatky', image: 'https://images.unsplash.com/photo-1549931319-a545dcf3bc73?q=80&w=800&auto=format&fit=crop', desc: 'Klasická ošatka pre dokonalý tvar bochníka.' },
            { id: '3', name: 'Nožík na narezávanie', price: 22.50, category: 'Náradie', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=800&auto=format&fit=crop', desc: 'Pre umelecké rezy na kôrke vášho chleba.' }
        ];

        const BLOGS = [
            { title: 'Ako začať s prvým kváskom', date: '12. Marec 2024', image: 'https://images.unsplash.com/photo-1585478259715-876acc5be8eb?q=80&w=800&auto=format&fit=crop' },
            { title: 'Tajomstvo chrumkavej kôrky', date: '10. Marec 2024', image: 'https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?q=80&w=800&auto=format&fit=crop' }
        ];

        let cart = [];

        // --- NAVIGÁCIA ---
        function navigate(view) {
            const content = document.getElementById('main-content');
            window.scrollTo(0,0);
            content.className = 'pt-20 min-h-screen fade-in';

            if (view === 'home') {
                content.innerHTML = `
                    <section class="min-h-[85vh] flex flex-col md:flex-row items-center bg-[#faf9f6]">
                        <div class="flex-1 px-8 md:px-24 py-16 text-center md:text-left">
                            <span class="text-stone-500 uppercase tracking-[0.4em] text-[10px] font-bold mb-6 block">Krása pomalého života</span>
                            <h1 class="text-5xl md:text-7xl text-stone-900 font-bold mb-8 leading-tight italic serif">Vôňa chleba,<br/>pokoj v šálke.</h1>
                            <p class="text-stone-600 text-lg mb-12 max-w-lg leading-relaxed italic">Objavte svet kváskového pečenia a výberovej kávy. Miesto, kde sa čas zastaví.</p>
                            <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                                <button onclick="navigate('shop')" class="bg-stone-900 text-white px-10 py-5 text-xs uppercase tracking-widest font-bold hover:bg-black shadow-xl transition-all">Obchod</button>
                                <button onclick="navigate('blog')" class="border-2 border-stone-900 text-stone-900 px-10 py-5 text-xs uppercase tracking-widest font-bold hover:bg-stone-900 hover:text-white transition-all">Čítať blog</button>
                            </div>
                        </div>
                        <div class="flex-1 p-12 hidden md:flex justify-center">
                            <img src="https://images.unsplash.com/photo-1549931319-a545dcf3bc73?q=80&w=800&auto=format&fit=crop" class="max-w-md rounded-sm shadow-2xl rotate-2">
                        </div>
                    </section>
                `;
            } else if (view === 'shop') {
                content.innerHTML = `
                    <div class="max-w-7xl mx-auto px-4 py-16">
                        <div class="text-center mb-16">
                            <h1 class="text-5xl mb-4 serif italic">Náš Obchod</h1>
                            <p class="text-stone-400 italic">Pomôcky pre tých, čo pečú doma s láskou.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                            ${PRODUCTS.map(p => `
                                <div class="group cursor-pointer">
                                    <div class="aspect-[4/5] overflow-hidden bg-stone-100 mb-6 rounded-sm shadow-sm relative">
                                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                        <button onclick="addToCart('${p.id}')" class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md py-3 text-[10px] uppercase font-bold tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Pridať do košíka</button>
                                    </div>
                                    <span class="text-[10px] uppercase tracking-widest text-stone-400 font-bold mb-2 block">${p.category}</span>
                                    <h3 class="text-lg mb-1 italic serif font-bold">${p.name}</h3>
                                    <p class="text-stone-900 font-medium">${p.price.toFixed(2)} €</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (view === 'blog') {
                content.innerHTML = `
                    <div class="max-w-5xl mx-auto px-4 py-16 text-center">
                        <h1 class="text-5xl mb-16 serif italic">Zápisník</h1>
                        <div class="space-y-24">
                            ${BLOGS.map(post => `
                                <article class="text-center max-w-2xl mx-auto">
                                    <img src="${post.image}" class="w-full h-80 object-cover mb-8 rounded-sm grayscale hover:grayscale-0 transition-all duration-700 shadow-lg">
                                    <span class="text-[10px] uppercase tracking-widest text-stone-400 font-bold">${post.date}</span>
                                    <h2 class="text-3xl mt-4 mb-4 serif italic font-bold">${post.title}</h2>
                                    <button class="border-b border-stone-900 pb-1 text-[10px] uppercase font-bold tracking-widest">Čítať viac</button>
                                </article>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- KOŠÍK FUNKCIE ---
        function addToCart(id) {
            const p = PRODUCTS.find(x => x.id === id);
            cart.push(p);
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const items = document.getElementById('cart-items');
            const footer = document.getElementById('cart-footer');
            const count = document.getElementById('cart-count');

            count.innerText = cart.length;
            count.classList.toggle('hidden', cart.length === 0);

            if (cart.length === 0) {
                items.innerHTML = 'Váš košík je prázdny.';
                footer.innerHTML = '';
            } else {
                items.innerHTML = cart.map((item, idx) => `
                    <div class="flex justify-between items-center border-b border-stone-100 pb-4">
                        <div>
                            <h4 class="text-sm font-bold serif italic">${item.name}</h4>
                            <p class="text-xs text-stone-400">${item.price.toFixed(2)} €</p>
                        </div>
                        <button onclick="cart.splice(${idx},1); updateCartUI();" class="text-stone-300 hover:text-black">✕</button>
                    </div>
                `).join('');
                const total = cart.reduce((acc, i) => acc + i.price, 0);
                footer.innerHTML = `
                    <div class="flex justify-between font-bold mb-4"><span>Spolu</span><span>${total.toFixed(2)} €</span></div>
                    <button class="w-full bg-stone-900 text-white py-4 text-[10px] uppercase font-bold tracking-widest hover:bg-black transition-colors">Pokračovať k platbe</button>
                `;
            }
        }

        function toggleCart(show) {
            document.getElementById('cart-sidebar').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('active', show);
        }

        // Štartovacia stránka
        navigate('home');
    </script>
</body>
</html>
